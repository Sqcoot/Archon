name: archon-self-improve
description: |
  Use when: The user explicitly wants to improve Archon itself, repair Archon source,
            improve Archon workflows/commands/ACO, or improve the self-improvement loop.
  Triggers: "archon self improve", "self-improve archon", "improve Archon itself",
            "repair Archon", "improve the self-improving loop", "meta Archon work".
  Does: Enters explicit repo-local meta mode, loads a specific or default self-improvement
        goal, selects one coherent slice, validates it, commits progress, and writes
        artifacts plus a compact next-goal handoff.
  NOT for: Ordinary Archon usage in another repository, normal bug fixes, feature work,
           PR review, docs work, or questions where Archon is the assistant rather than
           the product being improved.
provider: codex
model: gpt-5.3-codex
modelReasoningEffort: xhigh
mode: interactive_only
interactive: true
lock_scope: checkout_mutation
mutates_checkout: true
worktree:
  enabled: false

nodes:
  - id: prepare-goal
    bash: |
      set -euo pipefail

      DEFAULT_GOAL=".archon/self-improvement/default-goal.md"
      CURRENT_GOAL=".archon/state/self-improvement/current_goal_4000chars.txt"
      GOAL_OUT="$ARTIFACTS_DIR/self-improve-goal.md"
      CAPABILITY_OUT="$ARTIFACTS_DIR/capability-map.md"
      LEDGER_CANDIDATES_OUT="$ARTIFACTS_DIR/ledger-candidates.csv"
      LEDGER_DIR="tests/fixtures/aco/ledgers"

      if [ ! -f package.json ] || [ ! -d packages/cli ] || [ ! -d packages/workflows ] || [ ! -d packages/aco-core ] || [ ! -f "$DEFAULT_GOAL" ]; then
        echo "ERROR: archon-self-improve must run from the Archon source checkout."
        echo "This workflow is meta-mode for improving Archon itself, not for ordinary project work."
        echo "Expected package.json, packages/cli, packages/workflows, packages/aco-core, and $DEFAULT_GOAL."
        exit 1
      fi

      mkdir -p .archon/state/self-improvement
      mkdir -p "$ARTIFACTS_DIR"

      {
        echo "# Self-Improvement Goal"
        echo
        if [ -n "${ARGUMENTS:-}" ]; then
          echo "## Specific User Goal"
          echo
          printf '%s\n' "$ARGUMENTS"
          echo
        else
          echo "## Default Goal"
          echo
          if [ -f "$DEFAULT_GOAL" ]; then
            cat "$DEFAULT_GOAL"
          else
            echo "ERROR: missing $DEFAULT_GOAL"
            exit 1
          fi
          echo
        fi

        if [ -f "$CURRENT_GOAL" ]; then
          echo
          echo "## Mutable Current Goal"
          echo
          cat "$CURRENT_GOAL"
        fi
      } > "$GOAL_OUT"

      {
        echo "# Self-Improvement Capability Map"
        echo
        echo "## Runtime Context"
        echo
        echo "- workflow_provider: codex"
        echo "- workflow_model: gpt-5.3-codex"
        echo "- workflow_model_reasoning_effort: xhigh"
        echo "- workflow_mode: interactive_only"
        echo "- checkout: $(pwd)"
        echo "- git_branch: $(git branch --show-current 2>/dev/null || true)"
        echo "- git_head: $(git rev-parse --short HEAD 2>/dev/null || true)"
        echo
        echo "## Local ACO Ledgers"
        for file in artifact-ledger.csv tool-availability-ledger.csv capability-inventory.csv command-ledger.csv; do
          path="$LEDGER_DIR/$file"
          echo
          echo "### $file"
          if [ -f "$path" ]; then
            sed -n '1,80p' "$path"
          else
            echo "MISSING: $path"
          fi
        done
        echo
        echo "## Research and Graph Guardrails"
        echo "- Use repo evidence first for Archon behavior."
        echo "- Use Context7 or official docs for library, SDK, API, CLI, or cloud-service behavior."
        echo "- Use Agentic Search or web research for broader best-practice questions."
        echo "- Do not run bun run research:graph or graph-cache refreshes without explicit approval."
        echo
        echo "## CSV Ledger Discipline"
        echo "- CSV ledgers are architectural primitives for reviewable inventories."
        echo "- Future slices may create, update, consolidate, or remove CSV ledgers for any Archon surface."
        echo "- Committed ledgers need stable columns, producer/consumer intent, ownership, freshness, and validation."
        echo "- Do not pre-seed recurring candidates; populate candidate rows from fresh run evidence."
      } > "$CAPABILITY_OUT"

      {
        echo "id,surface,owner,status,confidence,freshness,mutation_class,evidence,notes"
      } > "$LEDGER_CANDIDATES_OUT"

      {
        echo "goal_artifact=$GOAL_OUT"
        echo "capability_artifact=$CAPABILITY_OUT"
        echo "ledger_candidates_artifact=$LEDGER_CANDIDATES_OUT"
        echo "ledger_candidates_policy=fresh_evidence_only"
        echo "default_goal=$DEFAULT_GOAL"
        echo "current_goal=$CURRENT_GOAL"
        echo "scope=Archon workflows, commands, ACO, providers, CLI/server/docs/tests, generated defaults, and the self-improvement loop when explicitly selected."
        echo "mutation_directions=Add Remove Consolidate Stabilize Clarify"
        echo "runtime_provider=codex"
        echo "runtime_model=gpt-5.3-codex"
        echo "runtime_model_reasoning_effort=xhigh"
        echo "git_branch=$(git branch --show-current 2>/dev/null || true)"
        echo "git_head=$(git rev-parse --short HEAD 2>/dev/null || true)"
        echo "git_status_short:"
        git status --short 2>/dev/null || true
      }
    timeout: 30000

  - id: self-improve
    command: archon-self-improve
    depends_on: [prepare-goal]
    context: fresh
    idle_timeout: 1800000

  - id: summarize
    prompt: |
      Create a concise self-improvement run summary from this run.

      ## Prepared Context

      $prepare-goal.output

      ## Self-Improve Result

      $self-improve.output

      ## Required Artifact

      Write `$ARTIFACTS_DIR/handoff.md` with:
      - selected slice
      - mutation direction: Add, Remove, Consolidate, Stabilize, or Clarify
      - capability map summary and selected capabilities
      - CSV ledger decision: created, updated, consolidated, removed, deferred,
        or not applicable
      - best-practice or research evidence used, or why none was needed
      - files changed
      - commit hash, or exact reason no commit was made
      - validation run and result
      - what remains
      - 3-5 ranked next-slice candidates based on current evidence
      - Recency Bias Check for the top candidate

      Also write:
      - `$ARTIFACTS_DIR/capability-map.md` if the prepare step did not already
        create one, preserving runtime/provider/model context and ACO ledger
        evidence.
      - `$ARTIFACTS_DIR/ledger-candidates.csv` listing useful CSV ledger
        opportunities with stable columns.
      - `$ARTIFACTS_DIR/ledger-change-plan.md` when the slice creates, updates,
        consolidates, or removes a committed CSV ledger.
      - `$ARTIFACTS_DIR/best-practices-evidence.md` when external or current
        best-practice evidence influenced the slice, otherwise state in the
        handoff why repo-local evidence was enough.
      - `$ARTIFACTS_DIR/scope-contract.md` defining why this was Archon meta-work,
        whether ACO was in or out of the chosen slice, and why normal Archon usage
        is not affected.
      - `$ARTIFACTS_DIR/decision-log.md` with the evidence used to choose Add,
        Remove, Consolidate, Stabilize, or Clarify.
      - `$ARTIFACTS_DIR/cleanup-opportunities.md` with stale, duplicated,
        misleading, or removable workflow/command/ACO surfaces found during the
        run, even if they were not selected.
      - `$ARTIFACTS_DIR/candidate-ranking.md` with the full next-run ranking and
        the Recency Bias Check.

      Also write `$ARTIFACTS_DIR/next_goal_4000chars.txt` with a compact next goal
      suitable for `.archon/state/self-improvement/current_goal_4000chars.txt`.
      It may name the top-ranked candidate, but it must also instruct the next run
      to re-rank candidates from fresh evidence instead of blindly continuing the
      just-finished slice.

      Keep the summary explicit that self-improvement mode is repo-local meta-work and
      does not apply to ordinary Archon usage in other repositories.
    depends_on: [self-improve]
    context: fresh
